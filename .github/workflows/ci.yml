name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update apt cache (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest

      - name: Cache Shards
        uses: actions/cache@v4
        with:
          path: lib
          key: ${{ runner.os }}-shards-${{ hashFiles('**/shard.lock', '**/shard.yml') }}
          restore-keys: |
            ${{ runner.os }}-shards-

      - name: Install Shard Dependencies
        run: shards install

      - name: Check Formatting
        if: matrix.os == 'ubuntu-latest'
        run: crystal tool format --check src spec

      - name: Build Bakelite CLI
        run: shards build bakelite

      - name: Run Specifications
        run: crystal spec --error-trace

      - name: Smoke Test Bakelite CLI (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          ./bin/bakelite --help
          ./bin/bakelite version
          ./bin/bakelite docs
          crystal docs
          test -f docs/index.html

      - name: Smoke Test Bakelite CLI (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          .\bin\bakelite.exe --help
          .\bin\bakelite.exe version
          .\bin\bakelite.exe docs
          crystal docs
          if (!(Test-Path docs\index.html)) { exit 1 }
