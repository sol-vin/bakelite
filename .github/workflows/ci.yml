name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update apt cache (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest

      - name: Install Shard Dependencies
        run: shards install

      - name: Check Formatting
        if: matrix.os == 'ubuntu-latest'
        run: crystal tool format --check

      - name: Build Bakelite CLI
        run: shards build bakelite

      - name: Run Specifications
        run: crystal spec --error-trace

      - name: Smoke Test Bakelite CLI (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          ./bin/bakelite --help
          ./bin/bakelite version
          ./bin/bakelite docs
          crystal docs
          test -f docs/index.html

      - name: Smoke Test Bakelite CLI (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          .\bin\bakelite.exe --help
          .\bin\bakelite.exe version
          .\bin\bakelite.exe docs
          crystal docs
          if (!(Test-Path docs\index.html)) { exit 1 }
